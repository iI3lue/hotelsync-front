name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Trigger Vercel deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "${DEPLOY_HOOK}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not configured (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          status=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -X POST "$DEPLOY_HOOK")
          echo "Vercel responded HTTP $status"
          cat /tmp/hook.out || true
          case "$status" in
            2*) echo "Deploy queued on Vercel" ;;
            *) echo "::error::Vercel deploy hook failed with HTTP $status"; exit 1 ;;
          esac

      - name: Wait for site health
        if: ${{ vars.HEALTH_URL != '' }}
        continue-on-error: true
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          deadline=$((SECONDS + 600))
          while [ $SECONDS -lt $deadline ]; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$HEALTH_URL" || echo 000)
            echo "GET $HEALTH_URL -> $code"
            if [ "$code" = "200" ]; then
              echo "Site responded 200"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Site did not return 200 within 10 minutes."
